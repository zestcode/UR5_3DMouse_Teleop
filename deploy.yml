# VPP policy on the UR5 (policy.py): the policy server (AtomicVPP_LIBERO step3_deploy_real_ur5.py, on this machine's
# GPU or through deploy.sh's SSH tunnel) moves the arm and the gripper. Started by deploy.sh. All nodes are in this
# directory. From the shell: ROBOT_IP, CAMERAS (teleop.local.env), POLICY_ADDR (deploy.sh), DRY_RUN, OUT_DIR, TASK,
# INSTRUCTION; MOCK_CAMERA, START_ROLLOUT tests only.
# The ur5 env is the one of dataflow.yml (the robot, workspace and speed limits the demonstrations were recorded with)
# plus CONTROL; the policy node's COLOR_* / FPS / VPP_* are the recorder's (the server checks VPP_* against its
# training data). tests/test_policy.py checks both against dataflow.yml.
nodes:
  - id: keyboard
    path: keyboard.py  # Space start / stop a rollout; h home; Esc home + stop; Ctrl-C stop
    inputs:
      tick:
        source: dora/timer/millis/5
        queue_size: 1
    outputs: [esc, record, home]
    env:
      RECORD_KEY: '1'
      HOME_KEY: '1'

  - id: ur5
    path: ur5.py
    inputs:
      waypoints:
        source: policy/waypoints  # the action chunk: timed absolute targets + gripper commands
        queue_size: 4
      heartbeat:
        source: policy/heartbeat  # `recording` = a rollout is running: only then the target follows the chunks
        queue_size: 1
      esc:
        source: keyboard/esc
        queue_size: 4
      home:
        source: keyboard/home
        queue_size: 4
      reset:
        source: policy/reset  # a rollout ended: open the gripper, then moveJ home
        queue_size: 4
    outputs: [state]
    env:
      CONTROL: 'policy'
      CONTROL_HZ: '125'
      MAX_LINEAR_M_S: '0.08'
      MAX_ANGULAR_RAD_S: '0.25'
      SERVO_LOOKAHEAD_S: '0.1'
      SERVO_GAIN: '300'
      LEASH_M: '0.03'
      LEASH_RAD: '0.2'
      STOP_ACCELERATION: '1.0'
      COMMAND_TIMEOUT_S: '0.15'
      RECORDER_TIMEOUT_S: '1.0'  # no policy heartbeat (cameras not delivering) for 1 s -> target frozen
      WATCHDOG_HZ: '5'
      WORKSPACE_OFFSET_MIN: '[null, null, -0.05]'
      WORKSPACE_OFFSET_MAX: '[null, null, 0.15]'
      WORKSPACE_Z_MIN: '-0.0965'
      BOUND_MARGIN_M: '0.02'
      HOME_Q_DEG: '[0, -90, 90, -90, -88, 180]'
      HOME_SPEED: '0.2'
      HOME_ACCELERATION: '0.3'
      HOME_DELAY_S: '3'
      GRIPPER: '1'
      GRIPPER_SPEED: '64'
      GRIPPER_FORCE: '100'

  - id: policy
    path: policy.py
    inputs:
      tick:
        source: dora/timer/millis/10
        queue_size: 1
      state:
        source: ur5/state
        queue_size: 1000       # never drop state samples
      record:
        source: keyboard/record
        queue_size: 16
      home:
        source: keyboard/home  # h during a rollout stops it (the ur5 node homes)
        queue_size: 4
    outputs: [heartbeat, reset, waypoints]
    env:
      HOME_AFTER_ROLLOUT: '1'  # after each rollout: gripper open + robot home; Space waits until done
      ROLLOUT_MAX_S: '60'      # a rollout stops by itself after 60 s ('0' = no limit); the demonstrations took ~30 s
      REPLAN_STEPS: '0'        # 0 = auto: the next chunk arrives just before the current one ends; N = every N steps
      REQUEST_TIMEOUT_S: '3'   # no reply within 3 s: the rollout stops (the target holds at the last waypoint)
      COLOR_W: '640'
      COLOR_H: '480'
      FPS: '30'
      MAX_POSE_GAP_MS: '50'
      VPP_CAMERAS: 'fixed,wrist'  # VPP camera order: 0 = rgb_static (third person), 1 = rgb_gripper
      VPP_CROP: 'fixed:150,100,500,450'  # role:x0,y0,x1,y1, cut before the resize, as the training videos
      VPP_FPS: '10'               # one action per 0.1 s
      VPP_SIZE: '256'
